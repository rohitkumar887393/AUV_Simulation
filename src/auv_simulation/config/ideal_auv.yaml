ideal_auv:
  ros__parameters:
    simulation_rate: 50.0

    # Actuator Time Constants (seconds)
    servo_time_constant: 0.10
    thruster_time_constant: 0.20

    # Phase 1 Physics Parameters
    # Rigid Body Mass & Inertia Properties
    mass: 25.0                 # Mass (kg) - AUV_MASS
    ix: 0.5                    # Roll Inertia (kg*m^2)
    iy: 2.0                    # Pitch Inertia (kg*m^2)
    iz: 2.0                    # Yaw Inertia (kg*m^2)

    # Hydrostatic Properties (Slight Positive Buoyancy for Surface Return)
    water_density: 1025.0      # Water Density (kg/m^3) - rho_water
    displaced_volume: 0.0247   # Displaced Volume (m^3) -> 24.7 L gives ~3.1N net upward lift
    gravity: 9.81              # Gravity (m/s^2) - g
    buoyancy_scale: 1.000      # Buoyancy adjustment parameter (BUOYANCY_SCALE)
    neutral_buoyancy_ratio: 1.000 # Backward-compatible alias
    z_bg: 0.03                 # Metacentric height offset between CG and CB (m)

    # Thruster Force Model (F = cmd * MAX_THRUST_N along forward body axis)
    max_thrust_n: 120.0        # Max thrust force (N) at full forward command (+1.0 norm)
    thrust_coefficient: 120.0  # Backward-compatible alias

    # Hydrodynamic Drag Parameters (Linear + Quadratic Drag)
    # F_drag = - (C_linear * v) - (0.5 * rho * Cd * A * v * |v|)
    linear_drag_x: 15.0        # Surge linear drag (N / (m/s))
    quadratic_drag_x: 25.0     # Surge quadratic drag (N / (m/s)^2)

    linear_drag_y: 35.0        # Sway linear drag
    quadratic_drag_y: 60.0     # Sway quadratic drag

    linear_drag_z: 15.0        # Heave linear drag (N / (m/s))
    quadratic_drag_z: 40.0     # Heave quadratic drag (N / (m/s)^2)

    # Effective Cd and Area parameters (aliases)
    cd_forward: 0.30
    cd_lateral: 1.00
    cd_vertical: 1.00
    area_forward: 0.03
    area_lateral: 0.20
    area_vertical: 0.20

    # Rotational Hydrodynamics (Phase 2 untouched)
    linear_drag_roll: 2.0      # Roll angular damping
    quadratic_drag_roll: 5.0

    linear_drag_pitch: 25.0    # Pitch angular damping (N*m*s/rad)
    quadratic_drag_pitch: 40.0

    linear_drag_yaw: 12.0      # Yaw angular damping
    quadratic_drag_yaw: 35.0

    # Control Surface Lift & Moment Coefficients
    elevator_lift_coeff: 0.015
    rudder_lift_coeff: 0.0035
    roll_lift_coeff: 0.004

    maximum_forward_velocity: 4.0
    maximum_angular_velocity: 60.0


